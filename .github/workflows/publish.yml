name: Publish packages

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # Setup Flutter SDK and automated pub.dev credentials
      - uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: 3.47.3

      - uses: flutter-actions/setup-pubdev-credentials@v1

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Copy LICENSE and changelog
        run: |
          cp LICENSE packages/inject0r/
          cp CHANGELOG.md packages/inject0r/

          cp LICENSE packages/flutter_inject0r/
          cp CHANGELOG.md packages/flutter_inject0r/

          cp LICENSE packages/jaspr_inject0r/
          cp CHANGELOG.md packages/jaspr_inject0r/

          cp LICENSE packages/flutter_inject0r_bloc/
          cp CHANGELOG.md packages/flutter_inject0r_bloc/
          
          cp LICENSE packages/jaspr_inject0r_bloc/
          cp CHANGELOG.md packages/jaspr_inject0r_bloc/

      - name: Clean pub cache
        run: flutter pub cache clean

      - name: Install dependencies
        run: flutter pub get

      - name: Publish inject0r
        run: dart pub publish --force
        working-directory: packages/inject0r

      - name: Publish flutter_inject0r
        run: dart pub publish --force
        working-directory: packages/flutter_inject0r

      - name: Publish jaspr_inject0r
        run: dart pub publish --force
        working-directory: packages/jaspr_inject0r

      - name: Publish flutter_inject0r_bloc
        run: dart pub publish --force
        working-directory: packages/flutter_inject0r_bloc

      - name: Publish jaspr_inject0r_bloc
        run: dart pub publish --force
        working-directory: packages/jaspr_inject0r_bloc